# App of apps: the only thing applied by hand.
#   kubectl apply -n argocd -f argocd/root-app.yaml
# After that, everything in argocd/apps/ is created and kept in sync from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shivamsharma20work-afk/gke-gitops-platform.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
