# kube-prometheus-stack (Prometheus, Alertmanager, Grafana) from the upstream chart,
# with our values file from this repo (multi-source Application).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 77.5.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/shivamsharma20work-afk/gke-gitops-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRDs are too large for client-side apply
---
# Our alert rules + Grafana dashboard, plain manifests from monitoring/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/shivamsharma20work-afk/gke-gitops-platform.git
    targetRevision: main
    path: monitoring
    directory:
      exclude: "kube-prometheus-stack-values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
