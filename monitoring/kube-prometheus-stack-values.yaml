# Trimmed for GKE Autopilot: no node-level components it doesn't allow.
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up ServiceMonitors / PrometheusRules from any namespace with release=monitoring
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    ruleSelector:
      matchLabels:
        release: monitoring
    resources:
      requests: { cpu: 250m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  config:
    route:
      receiver: slack
      group_by: [alertname, service]
      routes:
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          # URL is read from a Secret mounted into Alertmanager (not stored in Git)
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            channel: "#alerts"
            send_resolved: true
            title: '{{ .CommonLabels.severity | toUpper }}: {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  alertmanagerSpec:
    secrets:
      - alertmanager-slack

grafana:
  adminPassword: ""          # generated; read it from the monitoring-grafana Secret
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
