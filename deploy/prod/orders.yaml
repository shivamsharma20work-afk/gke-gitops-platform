# Argo CD renders charts/microservice with this file.
# image.tag is updated by CI on every merge to main; do not edit by hand.
image:
  repository: asia-south1-docker.pkg.dev/PROJECT_ID/shop/orders
  tag: "0.1.0"

env:
  CATALOG_URL: http://catalog.shop.svc.cluster.local

service:
  type: LoadBalancer   # public entry point for the demo

autoscaling:
  maxReplicas: 10
